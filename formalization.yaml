# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4. Replace every TEMPLATE value before submitting.
# Replace a placeholder list with [] only when its adjacent comment permits it;
# lists described as required must remain nonempty.
version: "v0.4"

project:
  name: "Erdos 99 Partial Solution"
  description: >-
    TEMPLATE: A formalization of a partial solution to Erdos Problem 99. It shows that Erdos Problem 99 holds for all sufficiently large n where h(n) is finite. Here, h(n) denotes the number of incongruence, diameter-minimizing sets of minimum separation at least 1.
  # Required nonempty list of name strings or mappings with a nonempty name.
  authors:
    - "Naveen Stewart"
  # Required root licence. Keep this in sync with the Apache-2.0 LICENSE file.
  license: "Apache-2.0"
  # Required nonempty list of name strings or mappings with a nonempty name.
  # For a thin wrapper, name people responsible for this submitted wrapper;
  # submission authorization separately covers the underlying formalization.
  responsible_maintainers:
    - "Naveen Stewart"

# Omit repository for an ordinary project: Palomar treats this submitted
# repository as the substantive proof development. If this repository is only
# a thin Comparator wrapper, uncomment and pin the actual formalization in this
# exact shape:
# repository:
#   substantive_formalization:
#     id: "TEMPLATE: owner/repository or https://github.com/owner/repository"
#     revision: "TEMPLATE: full 40-character lowercase commit SHA"

classification:
  # Use 1–2 official arXiv identifiers such as math.LO and 1–8 five-character
  # MSC 2020 identifiers such as 03B35.
  arxiv: ["math.CO"]
  msc2020: ["52C10"]

sources:
  # Sources must be nonempty. Every source needs a title and relationship; the
  # relationship must be exactly formalizes, adapts, independently-proves,
  # background, or other.
  # Choose one result origin:
  # - For a theorem first presented by this formalization, set one source to
  #   type: original-proof and relationship: other. All additional source
  #   relationships must be background or other.
  # - Otherwise, omit type: original-proof and give at least one source a
  #   formalizes, adapts, or independently-proves relationship. A new proof of
  #   a known published result is source-based and uses independently-proves.
  # Type, authors, contributors, id, location, note, license, and
  # author_endorsement are optional; remove them when genuinely inapplicable.
  # Authors are bibliographic authors. Contributors record other source roles,
  # with one name and free-form role such as editor or problem-proposer.
  # Type is a concise free-text
  # description such as article, paper, book, formalization, web post, folklore,
  # conversation, or other. The exact value original-proof is reserved for the
  # result-origin declaration described above.
  # Original-result example:
  # - title: "TEMPLATE: describe the result first presented here"
  #   type: original-proof
  #   relationship: other
  - title: "Erdos Problem 99 with Finite Multiplicity"
    authors:
      - "Naveen Stewart"
    id: "https://zenodo.org/records/23387136"
    type: "article"
    location: "https://zenodo.org/records/23387136"
    relationship: "formalizes"
    license: "CC-BY-4.0"
    author_endorsement: "participated"

status:
  scope: >-
    TEMPLATE: Proves Erdos Problem 99 for finite h(n). The infinite h(n) case is still open.
  # Count the proof development, excluding Challenge.lean's deliberate sorry.
  # Replace each count with an unquoted nonnegative integer, for example 0.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  # status.main_results is optional. Add it only when a short curated
  # project-level list is useful; it need not mirror Comparator declarations.

automation:
  methods:
    - method: "agent"
      models: ["Aristotle"]
      framework: "Harmonic Aristotle API"
      tool_setup: "Inputted finished manuscript for Lean 4 formalization."
      cost:
        wall_time: "10 hours"
        spend_usd: 0
        hardware: "API-only"
      prompting_notes: "n/a"
  spend_usd: "not tracked"

fidelity:
  divergences: "none known"

review:
  status: "self-assessed"
  reviewers: []
  notes: "Ensured the Lean 4 compiled without sorries after proving the work myself."

alignment:
  namespace: "Erdos-99-Partial"
  statements:
    - source: "Theorem 1.1"
      lean: "erdos99_finite_multiplicity"
      module: "Solution"
      status: "proved"
      note: "the overall formalization and proof of the partial result"

acknowledgements: []
